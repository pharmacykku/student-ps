<style>
/* ===== โทนเขียวเอิร์ธโทน (Moss / Olive / Forest) ===== */
:root{
  color-scheme: light;
  --bg:#f3f2ea; --surface:#ffffff; --surface-2:#eff1e6; --border:#dfe2d3; --border-strong:#c8ceb6;
  --text:#1e2a1b; --text-2:#56614d; --muted:#868e79;
  --brand:#4f7a3a; --brand-2:#86a35c; --brand-deep:#2f4f25; --brand-soft:#e1ead3; --brand-softer:#f1f5ea; --brand-ink:#ffffff;
  --accent:var(--brand); --accent-2:var(--brand-2); --accent-soft:var(--brand-soft);
  --hero:linear-gradient(120deg,#2b4722 0%,#4f7a3a 48%,#8d9b5a 100%);
  /* ลำดับสีหมวดหมู่ (โทนธรรมชาติ แยกกันชัด) */
  --s1:#5b8a3c; --s2:#4a7fb5; --s3:#3f8f86; --s4:#c9973a; --s5:#b8695b; --s6:#7d8b2a; --s7:#6f5a9a; --s8:#b4483f;
  --seq-1:#b8d0a0; --seq-2:#6f9a4f; --seq-3:#2f5a24;
  --good:#3d8b3d; --warning:#d9a21b; --serious:#c9773f; --critical:#b5413a;
  --grid:#e6e9da;
  --shadow:0 1px 2px rgba(40,60,20,.06),0 6px 20px rgba(40,60,20,.07);
  --shadow-lg:0 12px 36px rgba(40,60,20,.15);
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#11140f; --surface:#1a1f17; --surface-2:#222a1e; --border:#323c2b; --border-strong:#46523b;
    --text:#eff3e8; --text-2:#c3ccb6; --muted:#96a089;
    --brand:#5f9444; --brand-2:#86b366; --brand-deep:#46742f; --brand-soft:#2a3a21; --brand-softer:#1e2918; --brand-ink:#ffffff;
    --hero:linear-gradient(120deg,#1c3016 0%,#34552a 50%,#5a7339 100%);

    --grid:#28311f; --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 12px 36px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;

  --hero:linear-gradient(120deg,#1c3016 0%,#34552a 50%,#5a7339 100%);
  --s1:#79a957; --s2:#5f95cf; --s3:#4fa79c; --s4:#d6a849; --s5:#c97d6e; --s6:#9aa83c; --s7:#9585c4; --s8:#d0645a;
  --seq-1:#2f4a24; --seq-2:#5f8f43; --seq-3:#a9cc87;
  --grid:#28311f; --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 12px 36px rgba(0,0,0,.5);
}

@media (prefers-color-scheme: dark){ :root[data-pal="olive"]:not([data-theme="light"]){
  --bg:#12130c; --surface-2:#25281a; --border:#363a26; --border-strong:#4a4f33; --text:#f2f3e6; --text-2:#c9cbb0; --muted:#9b9d80; --grid:#2c2f1f;

  --seq-1:#3a4216; --seq-2:#7d8f34; --seq-3:#c4d17f; } }

  --bg:#12130c; --surface-2:#25281a; --border:#363a26; --border-strong:#4a4f33; --text:#f2f3e6; --text-2:#c9cbb0; --muted:#9b9d80; --grid:#2c2f1f;
  --brand:#73852d; --brand-2:#9cad52; --brand-deep:#56651f; --brand-soft:#2e3316; --brand-softer:#22260f;
  --accent:#73852d; --accent-2:#a7b85c; --accent-soft:#2e3316;
  --hero:linear-gradient(120deg,#232a09 0%,#3c4714 50%,#58682a 100%);
  --s1:#95a845; --s2:#5f95cf; --s3:#4fa79c; --s4:#d6a849; --s5:#c97d6e; --s6:#c97a45; --s7:#9585c4; --s8:#d0645a;
  --seq-1:#3a4216; --seq-2:#7d8f34; --seq-3:#c4d17f;
}
/* ส้ม (ชุดเดิม) */
:root[data-pal="orange"]{
  --bg:#fbf6f1; --surface-2:#fff5ec; --border:#f0e2d6; --border-strong:#e6cdb8; --text:#2a1a10; --text-2:#6b5546; --muted:#9a8576; --grid:#f1e6dc;

  --s1:#d95926; --s2:#3987e5; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;

  --s1:#d95926; --s2:#3987e5; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;

}
:root[data-pal="orange"][data-theme="light"] body{--surface:#ffffff}
@media (prefers-color-scheme: light){ :root[data-pal="orange"]:not([data-theme="dark"]) body{--surface:#ffffff} }
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Sarabun',system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,.display{font-family:'Prompt','Sarabun',sans-serif;font-weight:600;letter-spacing:-.005em}
a{color:var(--brand)}
.wrap{max-width:1320px;margin:0 auto;padding:16px 24px}

/* ---- hero / header ---- */
.hero{background:var(--hero);color:#fff;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 88% -20%,rgba(255,255,255,.22) 0,transparent 42%),
             radial-gradient(circle at 8% 130%,rgba(255,255,255,.14) 0,transparent 40%)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:320px;height:320px;border-radius:50%;border:40px solid rgba(255,255,255,.06);pointer-events:none}
.hero .wrap{position:relative;z-index:1}
.hero-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff;display:grid;place-items:center;font-family:'Prompt',sans-serif;font-weight:700;font-size:17px;flex:none;backdrop-filter:blur(6px)}
.logo.solid{background:var(--hero);border:0;box-shadow:0 6px 16px color-mix(in srgb,var(--brand) 35%,transparent)}
.title h1{font-size:20px;margin:0;line-height:1.3}
.title p{margin:0;opacity:.88;font-size:13.5px}
.spacer{flex:1}
.btn-glass{font:inherit;font-size:14px;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);padding:8px 14px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap;backdrop-filter:blur(6px);transition:background .15s}
.btn-glass:hover{background:rgba(255,255,255,.26)}
.btn-glass.solid{background:#fff;color:var(--brand-deep);border-color:#fff;font-weight:600}
.btn-glass.solid:hover{background:#f1f5ea}

/* ---- cards ---- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 18px 16px;min-width:0}
.card h3{margin:0 0 2px;font-size:15.5px;display:flex;align-items:center;gap:8px}
.card h3::before{content:"";width:4px;height:16px;border-radius:4px;background:linear-gradient(var(--accent-2),var(--accent));flex:none}
.card h3.plain::before{display:none}
.card .sub{margin:0 0 12px;color:var(--text-2);font-size:13px;padding-left:12px}

/* ---- controls ---- */
.btn{font:inherit;font-size:14px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);padding:7px 14px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s,box-shadow .15s}
.btn:hover{background:var(--brand-softer);border-color:var(--brand)}
.btn.primary{background:linear-gradient(135deg,var(--accent-2),var(--accent));border-color:transparent;color:var(--brand-ink);font-weight:600;box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 30%,transparent)}
.btn.primary:hover{filter:brightness(1.05);box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 38%,transparent)}
.btn.danger{color:var(--critical);border-color:var(--critical)}
.btn.danger:hover{background:rgba(208,59,59,.08)}
.btn.sm{padding:4px 11px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;font-size:14px;color:var(--text);background:var(--surface);border:1px solid var(--border-strong);border-radius:10px;padding:8px 11px;min-width:0;transition:border-color .15s,box-shadow .15s}
/* iOS ซูมหน้าจออัตโนมัติเมื่อแตะช่องกรอกที่ตัวอักษร < 16px (แล้วค้างซูม ต้องถ่างนิ้วออก) → มือถือใช้ 16px */
@media (max-width:900px),(pointer:coarse){input:not(.otp-in):not([type=checkbox]):not([type=radio]),select,textarea{font-size:16px!important}}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
input[type=checkbox]{accent-color:var(--brand)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--text-2);font-weight:500}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge{display:inline-flex;align-items:center;gap:4px;padding:1px 9px;border-radius:999px;font-size:12px;border:1px solid var(--border-strong);color:var(--text-2);white-space:nowrap;background:var(--surface)}
.badge.brand{background:var(--brand-soft);border-color:transparent;color:var(--brand-deep)}
:root[data-theme="dark"] .badge.brand{color:#cfe0b8}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.muted{color:var(--muted)}

/* ---- table ---- */
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:12px;max-width:100%}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th,table.t td{padding:9px 12px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
table.t th{position:sticky;top:0;background:var(--brand-softer);font-weight:600;color:var(--text-2);font-size:13px;z-index:1}
table.t tbody tr:hover{background:var(--brand-softer)}
table.t tbody tr:last-child td{border-bottom:0}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}

/* ---- segmented ---- */
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px}
.seg button{font:inherit;font-size:13px;border:0;background:transparent;color:var(--text-2);padding:5px 12px;cursor:pointer;border-radius:7px;transition:background .15s,color .15s}
.seg button:hover{color:var(--brand)}
.seg button.on{background:var(--surface);color:var(--brand);font-weight:600;box-shadow:0 1px 3px rgba(40,60,20,.15)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--surface);padding:11px 20px;border-radius:12px;z-index:1000;box-shadow:var(--shadow-lg);max-width:calc(100% - 32px);animation:up .2s ease-out}
@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}
.loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:48px;color:var(--text-2)}
.spin{width:22px;height:22px;border:3px solid var(--brand-soft);border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.theme-btn{width:38px;height:38px;padding:0;justify-content:center}

/* ===== Pop-up แจ้งผล ===== */
.ux-ov{position:fixed;inset:0;background:rgba(22,26,10,.46);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5000;animation:uxFade .18s ease-out}
.ux-ov.out{animation:uxFadeOut .16s ease-in forwards}.ux-ov.out .ux-box{animation:uxOut .16s ease-in forwards}
@keyframes uxFade{from{opacity:0}}@keyframes uxFadeOut{to{opacity:0}}@keyframes uxOut{to{transform:scale(.94);opacity:0}}
.ux-box{--uc:var(--brand);position:relative;overflow:hidden;background:var(--surface);color:var(--text);border-radius:20px;width:min(440px,100%);padding:32px 28px 24px;text-align:center;
  box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 28px 70px rgba(0,0,0,.28);animation:uxPop .34s cubic-bezier(.2,1.3,.4,1)}
.ux-box::before{content:"";position:absolute;left:0;right:0;top:0;height:120px;background:radial-gradient(60% 100% at 50% 0,color-mix(in srgb,var(--uc) 14%,transparent),transparent);pointer-events:none}
.ux-box.ux-k-success{--uc:var(--good)}.ux-box.ux-k-error,.ux-box.ux-k-danger{--uc:var(--critical)}.ux-box.ux-k-warning{--uc:#d99a06}.ux-box.ux-k-info,.ux-box.ux-k-mail{--uc:var(--s2,var(--brand))}
@keyframes uxPop{0%{transform:translateY(8px) scale(.9);opacity:0}100%{transform:none;opacity:1}}
/* ไอคอน: วงแหวน + สัญลักษณ์ ใช้กล่องเดียวกัน (grid) → อยู่กึ่งกลางเสมอ */
.ux-ic{--uc:inherit;position:relative;width:84px;height:84px;margin:0 auto 18px;display:grid;place-items:center;color:var(--uc)}
.ux-ic::before{content:"";grid-area:1/1;width:calc(100% - 10px);height:calc(100% - 10px);border-radius:50%;background:color-mix(in srgb,var(--uc) 9%,transparent)}
.ux-ic>svg{grid-area:1/1;display:block}
.ux-ic .ux-ring{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ux-ring circle{fill:none;stroke-width:3}
.ux-ring .bg{stroke:color-mix(in srgb,var(--uc) 18%,transparent)}
.ux-ring .fg{stroke:var(--uc);stroke-linecap:round;stroke-dasharray:264;stroke-dashoffset:264;animation:uxRing .55s .05s cubic-bezier(.6,0,.2,1) forwards}
.ux-ic .ux-g{width:50px;height:50px;stroke:currentColor;stroke-width:2.3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ux-g .draw{stroke-dasharray:100;stroke-dashoffset:100;animation:uxDraw .4s .45s ease-out forwards}
.ux-g .dot{fill:currentColor;stroke:none;transform-box:fill-box;transform-origin:center;transform:scale(0);animation:uxDot .25s .7s ease-out forwards}
.ux-ic::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 0 color-mix(in srgb,var(--uc) 35%,transparent);animation:uxHalo 1.1s .55s ease-out}
@keyframes uxRing{to{stroke-dashoffset:0}}@keyframes uxDraw{to{stroke-dashoffset:0}}@keyframes uxDot{to{transform:scale(1)}}
@keyframes uxHalo{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--uc) 22%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
.ux-ic.ux-error .ux-g,.ux-ic.ux-danger .ux-g{animation:uxShake .4s .5s}
@keyframes uxShake{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
.ux-ic.ux-loading .ux-ring .fg{stroke-dasharray:66 264;stroke-dashoffset:0;animation:none}
.ux-ic.ux-loading .ux-ring{animation:uxSpin .9s linear infinite}.ux-ic.ux-loading::after{display:none}
@keyframes uxSpin{from{transform:rotate(-90deg)}to{transform:rotate(270deg)}}
.ux-t{position:relative;font-family:'Prompt',sans-serif;font-size:21px;font-weight:600;letter-spacing:.1px;margin:0 0 6px;line-height:1.35}
.ux-m{position:relative;font-size:15px;color:var(--text-2);margin:0 0 4px;white-space:pre-line;line-height:1.6;overflow-wrap:anywhere}
.ux-acts{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.ux-b{font:inherit;font-weight:600;font-size:15px;border:0;border-radius:11px;padding:10px 26px;cursor:pointer;min-width:110px;transition:filter .15s,box-shadow .15s,transform .1s}
.ux-b:active{transform:scale(.97)}
.ux-b:focus-visible{outline:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 35%,transparent)}
.ux-b.ok{background:linear-gradient(180deg,color-mix(in srgb,var(--brand-deep,#4a5a14) 85%,#fff),var(--brand-deep,#4a5a14));color:#fff;box-shadow:0 3px 10px color-mix(in srgb,var(--brand-deep,#4a5a14) 22%,transparent)}.ux-b.ok:hover{filter:brightness(1.08)}
.ux-b.ok.red{background:var(--critical);box-shadow:0 3px 10px color-mix(in srgb,var(--critical) 22%,transparent)}
.ux-b.no{background:var(--surface-2);color:var(--text-2);border:1px solid var(--border)}.ux-b.no:hover{color:var(--text)}
.ux-x{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;border:0;background:transparent;color:var(--text-3,var(--muted));cursor:pointer;display:grid;place-items:center;z-index:1}
.ux-x:hover{background:var(--surface-2);color:var(--text)}.ux-x svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round}
.ux-bar{position:relative;height:4px;border-radius:2px;background:color-mix(in srgb,var(--uc) 15%,transparent);margin:20px auto 0;width:64%;overflow:hidden}
.ux-bar i{display:block;height:100%;background:var(--uc);border-radius:2px;animation:uxBar linear forwards}
@keyframes uxBar{from{width:100%}to{width:0}}
.ux-in{width:100%;margin-top:12px;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text)}
.ux-in:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent)}
/* แถบแจ้งเตือนเล็ก (toast) */
.toast{display:flex;align-items:center;gap:10px;font-size:14.5px;line-height:1.45}
.toast .t-ic{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.16)}
.toast .t-ic svg{display:block;width:14px;height:14px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.toast.out{animation:tOut .2s ease-in forwards}@keyframes tOut{to{opacity:0;transform:translate(-50%,8px)}}

<script>
/* ===== UX: pop-up แจ้งผล/ยืนยัน (ใช้ร่วมทั้งหน้า Dashboard และผู้ดูแลระบบ) =====
   UX.alert({icon:'success'|'error'|'warning'|'info', title, text, timer})   → Promise
   UX.confirm({title, text, ok, cancel, danger})                            → Promise<boolean>
   UX.loading(title, text) / UX.close()                                          */
(function () {
  // สัญลักษณ์ทุกตัวออกแบบให้กึ่งกลางกล่อง 48×48 อยู่ที่ (24,24) พอดี
  const G = {
    success: '<path class="draw" d="M14 24.5l7 7 13-14"/>',
    error: '<path class="draw" d="M16 16l16 16M32 16L16 32"/>',
    danger: '<path class="draw" d="M15 17h18M20 17v-3h8v3M17.5 17l1.5 17h10l1.5-17M22 22v7M26 22v7"/>',
    warning: '<path class="draw" d="M24 12v14"/><circle class="dot" cx="24" cy="34" r="2.4"/>',
    info: '<circle class="dot" cx="24" cy="14" r="2.4"/><path class="draw" d="M24 21v15"/>',
    question: '<path class="draw" d="M18.5 18a5.5 5.5 0 1 1 8.2 4.8c-1.7.9-2.7 2-2.7 3.9v1"/><circle class="dot" cx="24" cy="34" r="2.4"/>',
    mail: '<path class="draw" d="M13 16h22v16H13zM13 17l11 8 11-8"/>',
    lock: '<path class="draw" d="M15 22h18v13H15zM19 22v-4a5 5 0 0 1 10 0v4M24 27v3"/>'
  };
  const RING = '<svg class="ux-ring" viewBox="0 0 100 100" aria-hidden="true"><circle class="bg" cx="50" cy="50" r="42"/><circle class="fg" cx="50" cy="50" r="42"/></svg>';
  Object.keys(G).forEach(k => G[k] = G[k].replace(/<path class="draw"/g, '<path class="draw" pathLength="100"'));
  const iconHtml = k => k === 'loading' ? `<div class="ux-ic ux-loading">${RING}</div>`
    : `<div class="ux-ic ux-${k}">${RING}<svg class="ux-g" viewBox="0 0 48 48" aria-hidden="true">${G[k] || G.info}</svg></div>`;
  window.UX_ICON = iconHtml;

  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let cur = null;
  function close(v) {
    if (!cur) return;
    const c = cur; cur = null; clearTimeout(c.t);
    document.removeEventListener('keydown', c.key, true);
    c.ov.classList.add('out'); setTimeout(() => c.ov.remove(), 150);
    c.done(v);
  }
  function open(o) {
    if (cur) close(cur.dflt);
    return new Promise(done => {
      const ov = document.createElement('div'); ov.className = 'ux-ov';
      ov.setAttribute('role', o.buttons ? 'alertdialog' : 'dialog'); ov.setAttribute('aria-modal', 'true');
      const icon = o.icon ? iconHtml(o.icon) : '';
      const x = o.buttons && o.dismiss !== false ? '<button class="ux-x" aria-label="ปิด" data-x="1"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>' : '';
      ov.innerHTML = `<div class="ux-box ux-k-${o.icon || 'none'}">${x}${icon}<h2 class="ux-t">${esc(o.title)}</h2>${o.text ? `<p class="ux-m">${esc(o.text)}</p>` : ''}${o.html || ''}
        ${o.buttons ? `<div class="ux-acts">${o.buttons.map((b, i) => `<button class="ux-b ${b.cls}" data-i="${i}">${esc(b.label)}</button>`).join('')}</div>` : ''}
        ${o.timer ? `<div class="ux-bar"><i style="animation-duration:${o.timer}ms"></i></div>` : ''}</div>`;
      document.body.appendChild(ov);
      const c = cur = { ov, done, dflt: o.dflt, t: 0, key: null };
      ov.querySelectorAll('.ux-b').forEach(b => b.onclick = () => close(o.buttons[b.dataset.i].v));
      const xb = ov.querySelector('.ux-x'); if (xb) xb.onclick = () => close(o.dflt);
      if (o.timer && !o.buttons) ov.addEventListener('mousedown', () => close(o.dflt));
      if (o.dismiss !== false) ov.addEventListener('mousedown', e => { if (e.target === ov) close(o.dflt); });
      c.key = e => { if (e.key === 'Escape' && o.dismiss !== false) { e.preventDefault(); close(o.dflt); } if (e.key === 'Enter' && o.buttons) { e.preventDefault(); close(o.buttons[o.buttons.length - 1].v); } };
      document.addEventListener('keydown', c.key, true);
      if (o.timer) c.t = setTimeout(() => close(o.dflt), o.timer);
      const f = ov.querySelector('.ux-b.ok') || ov.querySelector('.ux-b'); if (f) setTimeout(() => f.focus(), 30);
    });
  }
  window.UX = {
    alert(o) {
      o = typeof o === 'string' ? { title: o } : o;
      return open({ icon: o.icon || 'success', title: o.title, text: o.text, html: o.html, timer: o.timer, dflt: true, buttons: o.timer && !o.button ? null : [{ label: o.ok || 'ตกลง', cls: 'ok', v: true }] });
    },
    confirm(o) {
      o = typeof o === 'string' ? { title: o } : o;
      return open({ icon: o.icon || (o.danger ? 'danger' : 'question'), title: o.title, text: o.text, dflt: false,
        buttons: [{ label: o.cancel || 'ยกเลิก', cls: 'no', v: false }, { label: o.ok || 'ยืนยัน', cls: 'ok' + (o.danger ? ' red' : ''), v: true }] });
    },
    prompt(o) {
      const pr = open({ icon: o.icon || 'question', title: o.title, text: o.text, html: `<input class="ux-in" value="${esc(o.value || '')}" placeholder="${esc(o.placeholder || '')}">`, dflt: null,
        buttons: [{ label: o.cancel || 'ยกเลิก', cls: 'no', v: null }, { label: o.ok || 'บันทึก', cls: 'ok', v: 1 }] });
      const inp = [...document.querySelectorAll('.ux-ov .ux-in')].pop();
      if (inp) setTimeout(() => { inp.focus(); inp.select(); }, 40);
      return pr.then(v => v ? (inp ? inp.value.trim() : '') : null);
    },
    loading(title, text) { open({ icon: 'loading', title: title || 'กำลังดำเนินการ…', text, dismiss: false, dflt: null }); },
    close() { close(cur ? cur.dflt : null); },
    success(title, text, timer) { return this.alert({ icon: 'success', title, text, timer: timer === undefined ? 1800 : timer }); },
    error(title, text) { return this.alert({ icon: 'error', title, text }); },
    warn(title, text) { return this.alert({ icon: 'warning', title, text }); },
    /** แถบแจ้งเตือนเล็กด้านล่าง (ไม่บังงาน) · kind: info | ok | wait */
    toast(msg, ms, kind) {
      document.querySelectorAll('.toast').forEach(t => t.remove());
      const P = { info: '<path d="M12 11v6"/><path d="M12 7.5h.01"/>', ok: '<path d="M6 12.5l4 4 8-9"/>', wait: '<path d="M12 7v5l3 2"/>' };
      kind = kind || (/^กำลัง/.test(msg) ? 'wait' : /แล้ว|สำเร็จ/.test(msg) ? 'ok' : 'info');
      const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status');
      t.innerHTML = `<span class="t-ic"><svg viewBox="0 0 24 24">${P[kind] || P.info}</svg></span><span>${esc(msg)}</span>`;
      document.body.appendChild(t); t.onclick = () => t.remove();
      setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 220); }, ms || 3000);
    }
  };
  /** ยืนยันแบบเดียวกับ confirm() เดิม: บรรทัดแรก = หัวข้อ, บรรทัดถัดไป = รายละเอียด · คำว่า ลบ/ย้อน/ส่ง = ปุ่มสีแดง */
  window.ask = function (msg, opt) {
    const [t, ...rest] = String(msg).split('\n');
    const danger = /^(ลบ|ย้อน|ย้าย.*ถังขยะ)/.test(t.trim());
    return UX.confirm(Object.assign({ title: t, text: rest.join('\n').trim(), danger, ok: danger ? (/^ลบ/.test(t) ? 'ลบ' : 'ยืนยัน') : 'ยืนยัน' }, opt || {}));
  };
})();
</script>
