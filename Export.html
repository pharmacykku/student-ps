<!-- ===== ระบบส่งออกกลาง: CSV / Excel / PDF (ใช้ร่วมกันทั้งหน้า Dashboard และหน้าผู้ดูแล) ===== -->
<!-- ตัวสร้าง Excel / PDF: โหลดแบบ defer (ไม่บล็อกการเปิดหน้า) -->
<script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
/** โหลดไลบรารีเมื่อใช้งานจริง (ลดเวลาเปิดหน้า) */
window.LIB = window.LIB || (function () {
  const SRC = {
    xlsx: ['https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js', () => window.XLSX],
    chart: ['https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js', () => window.Chart],
    pdfjs: ['https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js', () => window.pdfjsLib],
    pdflib: ['https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js', () => window.PDFLib],
    jspdf: ['https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js', () => window.jspdf],
    h2c: ['https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', () => window.html2canvas],
    jszip: ['https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js', () => window.JSZip]
  }, P = {};
  // แหล่งสำรอง: ถ้า CDN หลักโหลดไม่ได้ ลองอีกแหล่ง
  const ALT = u => [u, u.replace('https://cdn.jsdelivr.net/npm/', 'https://unpkg.com/'), u.replace('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/', 'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/').replace('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/', 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/').replace('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/', 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/').replace('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/', 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/')].filter((x, i, a) => a.indexOf(x) === i);
  function tag(u) { return new Promise((ok, no) => { const e = document.createElement('script'); e.src = u; e.async = true; const t = setTimeout(() => { e.remove(); no(new Error('timeout')); }, 20000);
    e.onload = () => { clearTimeout(t); ok(); }; e.onerror = () => { clearTimeout(t); e.remove(); no(new Error('load ' + u)); }; document.head.appendChild(e); }); }
  const waitG = (f, ms) => new Promise(ok => { const t0 = Date.now(); (function w() { if (f() || Date.now() - t0 > ms) ok(); else setTimeout(w, 100); })(); });
  function one(k) {
    const s = SRC[k]; if (s[1]()) return Promise.resolve(); if (P[k]) return P[k];
    return P[k] = (async () => { if (['xlsx', 'jszip', 'jspdf', 'h2c'].indexOf(k) >= 0 && document.readyState !== 'complete') { await waitG(s[1], 8000); if (s[1]()) return; } const L = ALT(s[0]); for (let i = 0; i < L.length; i++) { try { await tag(L[i]); if (s[1]()) break; } catch (e) { if (i === L.length - 1) { delete P[k]; console.warn('LIB', k, e.message); throw e; } } }
      if (k === 'pdfjs' && window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; })();
  }
  /** need('xlsx') / need('pdf') = jspdf + html2canvas · คืน true เมื่อพร้อม */
  async function need() { const L = [].concat(...[].slice.call(arguments).map(k => k === 'pdf' ? ['jspdf', 'h2c'] : [k]));
    try { await Promise.all(L.map(one)); return true; } catch (e) { return false; } }
  // โหลดล่วงหน้าเงียบ ๆ ตอนเครื่องว่าง (หลังหน้าเปิดเสร็จ) — ไม่บล็อกการเปิดหน้า
  function idle(keys) { const go = () => keys.forEach(k => one(k).catch(() => {})); if (window.requestIdleCallback) requestIdleCallback(() => setTimeout(go, 4000)); else setTimeout(go, 6000); }
  return { need, idle, ok: true };
})();
</script>
<style>

<script>
const XP = (function () {
  const FAC = 'คณะเภสัชศาสตร์ มหาวิทยาลัยขอนแก่น';
  const stamp = () => { const d = new Date(); return `${d.getDate()}/${d.getMonth() + 1}/${d.getFullYear() + 543} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')} น.`; };
  const fstamp = () => new Date().toISOString().slice(0, 10);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const safeName = s => String(s).replace(/[\\/:*?"<>|]+/g, '_');
  // เบราว์เซอร์ (หน้าเว็บ Apps Script) อนุญาตให้ดาวน์โหลดอัตโนมัติเฉพาะไม่กี่วินาทีหลังผู้ใช้คลิก
  // ถ้าสร้างไฟล์นานเกิน → แสดงปุ่ม "ดาวน์โหลดไฟล์" ให้กดเอง (การกดใหม่ = อนุญาตดาวน์โหลด)
  let lastAct = 0; ['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, () => lastAct = Date.now(), true));
  function save(blob, name) {
    const url = URL.createObjectURL(blob);
    const auto = true; { const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => a.remove(), 1500); }
    let w = document.getElementById('xpReady'); if (w) w.remove();
    w = document.createElement('div'); w.id = 'xpReady';
    w.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:100000;background:var(--surface,#fff);color:var(--text,#222);border:1px solid var(--border,#ddd);border-radius:14px;box-shadow:0 12px 34px rgba(0,0,0,.22);padding:12px 14px;display:flex;gap:10px;align-items:center;font:14px Sarabun,sans-serif;max-width:calc(100vw - 24px)';
    w.innerHTML = '<span>' + (Date.now() - lastAct < 3500 ? 'ถ้าไฟล์ไม่ดาวน์โหลดอัตโนมัติ กดปุ่มนี้: ' : 'ไฟล์พร้อมแล้ว: ') + '<b></b></span><a class="btn primary" style="text-decoration:none;white-space:nowrap">ดาวน์โหลดไฟล์</a><button class="btn" style="white-space:nowrap">ปิด</button>';
    w.querySelector('b').textContent = name; const a2 = w.querySelector('a'); a2.href = url; a2.download = name;
    a2.onclick = () => setTimeout(() => w.remove(), 400); w.querySelector('button').onclick = () => w.remove();
    document.body.appendChild(w); setTimeout(() => { if (w.isConnected) w.remove(); }, Date.now() - lastAct < 3500 ? 12000 : 120000); setTimeout(() => { if (w.isConnected) w.remove(); URL.revokeObjectURL(url); }, 10 * 60 * 1000);
  }
  const xsave = (wb, name) => save(new Blob([XLSX.write(wb, { bookType: 'xlsx', type: 'array' })], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), name);
  function logoUrl() {
    const el = document.querySelector('.logo-img'); if (!el) return '';
    const m = getComputedStyle(el).backgroundImage.match(/url\("?(.*?)"?\)/); return m ? m[1] : '';
  }
  function toast_(m, ms) { if (typeof toast === 'function') toast(m, ms); }

  // ---------- CSV ----------
  function csv(T) {
    const cell = v => { v = String(v == null ? '' : v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    const txt = '﻿' + [T.headers, ...T.rows].map(r => r.map(cell).join(',')).join('\r\n');
    save(new Blob([txt], { type: 'text/csv;charset=utf-8' }), safeName(T.file) + '.csv');
  }
  // ---------- Excel ----------
  async function xlsx(T) {
    if (!await LIB.need('xlsx')) { toast_('โหลดตัวสร้าง Excel ไม่สำเร็จ — ตรวจสอบอินเทอร์เน็ต หรือเลือก CSV'); return false; }
    const aoa = [[T.title], [T.sub || ''], [`${FAC} · ส่งออกเมื่อ ${stamp()}`], [], T.headers, ...T.rows.map(r => r.map(v => (typeof v === 'string' && /^-?\d+(\.\d+)?$/.test(v) && !/^0\d/.test(v) && v.length < 12) ? Number(v) : v))];
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = T.headers.map((h, i) => ({ wch: Math.min(45, Math.max(String(h).length + 2, ...T.rows.slice(0, 300).map(r => String(r[i] == null ? '' : r[i]).length + 1))) }));
    ws['!merges'] = [0, 1, 2].map(r => ({ s: { r, c: 0 }, e: { r, c: Math.max(0, T.headers.length - 1) } }));
    ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 4, c: 0 }, e: { r: 4 + T.rows.length, c: T.headers.length - 1 } }) };
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, safeName(T.sheet || 'ข้อมูล').slice(0, 31));
    (T.extraSheets || []).forEach(x => XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([x.headers, ...x.rows]), safeName(x.name).slice(0, 31)));
    xsave(wb, safeName(T.file) + '.xlsx');
  }
  // html2canvas 1.4 อ่านสีรูปแบบใหม่ (color-mix → color(srgb …), oklch) ไม่ได้ → แปลงเป็น rgba ในสำเนาก่อนจับภาพ
  const COLOR_PROPS = ['color', 'backgroundColor', 'borderTopColor', 'borderRightColor', 'borderBottomColor', 'borderLeftColor', 'outlineColor', 'textDecorationColor', 'boxShadow', 'backgroundImage', 'fill', 'stroke', 'stopColor'];
  const toRgba = v => v.replace(/color\(srgb\s+([\d.e-]+)\s+([\d.e-]+)\s+([\d.e-]+)(?:\s*\/\s*([\d.e%-]+))?\)/g, (m, r, g, b, a) =>
    `rgba(${Math.round(Math.min(1, Math.max(0, +r)) * 255)},${Math.round(Math.min(1, Math.max(0, +g)) * 255)},${Math.round(Math.min(1, Math.max(0, +b)) * 255)},${a == null ? 1 : /%$/.test(a) ? parseFloat(a) / 100 : +a})`)
    .replace(/(?:oklch|oklab|lch|lab)\([^)]*\)/g, 'rgba(128,128,128,1)');
  function fixColors(doc) {
    const win = doc.defaultView;
    doc.querySelectorAll('*').forEach(el => {
      const cs = win.getComputedStyle(el);
      COLOR_PROPS.forEach(k => { const v = cs[k]; if (v && /color\(|oklch|oklab|lch\(|lab\(/.test(v)) el.style[k] = toRgba(v); });
    });
  }
  window.H2C_OPT = { onclone: fixColors };
  // ---------- PDF (ตาราง A4 แบ่งหน้าอัตโนมัติ รองรับภาษาไทย) ----------
  async function pdf(T, opt) {
    opt = opt || {};
    if (!await LIB.need('pdf')) return toast_('โหลดตัวสร้าง PDF ไม่สำเร็จ ตรวจสอบอินเทอร์เน็ต');
    if (T.rows.length > 3000) return toast_('ข้อมูลมากเกิน 3,000 แถวสำหรับ PDF — กรุณากรองข้อมูล หรือเลือก Excel/CSV', 6000);
    const land = opt.orientation ? opt.orientation === 'landscape' : T.headers.length > 6;
    const W = land ? 1123 : 794, H = land ? 794 : 1123;
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const logo = logoUrl();
    const head = `<div class="hd">${logo ? `<img class="lg" src="${logo}">` : ''}<div><h1>${esc(T.title)}</h1><p>${esc(T.sub || FAC)}</p></div><div class="dt">${esc(FAC)}<br>ข้อมูล ณ ${stamp()}</div></div>`;
    const thead = `<thead><tr>${T.headers.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead>`;
    const doc = new jspdf.jsPDF({ orientation: land ? 'landscape' : 'portrait', unit: 'pt', format: 'a4' });
    const pw = doc.internal.pageSize.getWidth(), ph = doc.internal.pageSize.getHeight();
    const rowHtml = r => `<tr>${r.map(v => `<td>${esc(v)}</td>`).join('')}</tr>`;
    // สร้างทีละหน้า: เติมแถวจนเต็มหน้าจริง (วัดจากหน้ากระดาษจริง จึงไม่ล้น/ไม่เหลือที่ว่าง)
    const pages = [];
    let i = 0;
    while (i < T.rows.length || !pages.length) {
      const el = document.createElement('div'); el.className = 'xp-page'; el.style.width = W + 'px'; el.style.height = H + 'px';
      el.innerHTML = head + `<table>${thead}<tbody></tbody></table>`;
      document.body.appendChild(el);
      const tb = el.querySelector('tbody'), tbl = el.querySelector('table'), limit = H - 46 - (T.sign ? 110 : 0) - (T.note ? 24 : 0);
      const start = i;
      while (i < T.rows.length) {
        tb.insertAdjacentHTML('beforeend', rowHtml(T.rows[i]));
        if (tbl.offsetTop + tbl.offsetHeight > limit && i > start) { tb.lastElementChild.remove(); break; }
        i++;
      }
      pages.push(el);
      if (T.rows.length === 0) break;
    }
    for (let p = 0; p < pages.length; p++) {
      if (opt.progress) opt.progress(p / pages.length);
      const el = pages[p];
      if (p === pages.length - 1 && T.note) el.insertAdjacentHTML('beforeend', `<p style="font-size:12px;color:#6b5546;margin-top:10px">${esc(T.note)}</p>`);
      if (p === pages.length - 1 && T.sign && T.sign.length) el.insertAdjacentHTML('beforeend', `<div style="display:flex;justify-content:flex-end;gap:60px;margin-top:26px;font-size:13px">${T.sign.map(s => `<div style="text-align:center;min-width:200px">ลงชื่อ ..................................................<br>(..................................................)<br>${esc(s)}<br>วันที่ ......../......../........</div>`).join('')}</div>`);
      el.insertAdjacentHTML('beforeend', `<div class="ft"><span>${esc(T.footer || 'ระบบฐานข้อมูลนักศึกษา · งานบริการการศึกษา')}</span><span>รวม ${T.rows.length.toLocaleString()} รายการ · หน้า ${p + 1}/${pages.length}</span></div>`);
      const cv = await html2canvas(el, { scale: 1.6, backgroundColor: '#ffffff', logging: false, onclone: fixColors });
      el.remove();
      if (p) doc.addPage();
      doc.addImage(cv.toDataURL('image/jpeg', 0.8), 'JPEG', 0, 0, pw, ph, undefined, 'FAST');
    }
    if (opt.progress) opt.progress(1);
    save(doc.output('blob'), safeName(T.file) + '.pdf');
  }
  // ---------- PDF จากส่วนของหน้าเว็บ (เช่น โปรไฟล์นักศึกษา / Dashboard) ----------
  async function pdfFromElement(el, file, title) {
    if (!await LIB.need('pdf')) return toast_('โหลดตัวสร้าง PDF ไม่สำเร็จ');
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    toast_('กำลังสร้าง PDF…');
    const bg = toRgba(getComputedStyle(document.body).backgroundColor);
    let cv;
    try { cv = await html2canvas(el, { scale: 2, backgroundColor: bg, logging: false, onclone: fixColors }); }
    catch (e) { return toast_('สร้าง PDF ไม่สำเร็จ: ' + e.message, 6000); }
    const doc = new jspdf.jsPDF({ orientation: 'portrait', unit: 'pt', format: 'a4' });
    const pw = doc.internal.pageSize.getWidth(), ph = doc.internal.pageSize.getHeight(), m = 24;
    const iw = pw - m * 2, scale = iw / cv.width, pageH = Math.floor((ph - m * 2 - 14) / scale);
    let y = 0, n = 0; const total = Math.ceil(cv.height / pageH);
    while (y < cv.height) {
      const h = Math.min(pageH, cv.height - y);
      const c = document.createElement('canvas'); c.width = cv.width; c.height = h;
      c.getContext('2d').drawImage(cv, 0, y, cv.width, h, 0, 0, cv.width, h);
      if (n) doc.addPage();
      doc.addImage(c.toDataURL('image/jpeg', 0.9), 'JPEG', m, m, iw, h * scale);
      doc.setFontSize(8); doc.setTextColor(150); doc.text(`${n + 1} / ${total}`, pw - m, ph - 10, { align: 'right' });
      y += h; n++;
    }
    save(doc.output('blob'), safeName(file) + '.pdf');
  }

  // ---------- หน้าต่างเลือกรูปแบบไฟล์ ----------
  let modal, state = {};
  function ensureModal() {
    if (modal) return modal;
    modal = document.createElement('div'); modal.className = 'modal-bg'; modal.id = 'mExport';
    modal.innerHTML = `<div class="modal" style="width:min(640px,100%)"><header><h3 id="xpTitle">ส่งออกข้อมูล</h3><button class="btn sm" id="xpClose"><i class="ico" data-i="x"></i></button></header>
      <div class="body">
        <p class="muted" id="xpSub" style="margin:0 0 12px"></p>
        <div class="xp-formats">
          <button class="xp-fmt on" data-f="xlsx"><div class="i"><i class="ico" data-i="file-sheet"></i></div><b>Excel</b><span>.xlsx แก้ไข/คำนวณต่อได้</span></button>
          <button class="xp-fmt" data-f="csv"><div class="i"><i class="ico" data-i="file"></i></div><b>CSV</b><span>.csv นำเข้าระบบอื่น</span></button>
          <button class="xp-fmt" data-f="pdf"><div class="i"><i class="ico" data-i="file-pdf"></i></div><b>PDF</b><span>.pdf พิมพ์/แนบหนังสือ</span></button>
        </div>
        <div id="xpPdfOpt" class="row" style="display:none;margin-bottom:12px;font-size:14px">
          <span>แนวกระดาษ:</span>
          <label class="row" style="gap:4px"><input type="radio" name="xpOr" value="auto" checked> อัตโนมัติ</label>
          <label class="row" style="gap:4px"><input type="radio" name="xpOr" value="portrait"> แนวตั้ง</label>
          <label class="row" style="gap:4px"><input type="radio" name="xpOr" value="landscape"> แนวนอน</label>
        </div>
        <div id="xpColsWrap"><div class="row" style="justify-content:space-between;margin-bottom:6px;font-size:14px"><b>คอลัมน์ที่ต้องการ</b><span><a href="#" id="xpAll">เลือกทั้งหมด</a> · <a href="#" id="xpNone">ไม่เลือก</a></span></div><div class="xp-cols" id="xpCols"></div></div>
        <label class="f" style="margin-top:12px">ชื่อไฟล์<input id="xpFile"></label>
        <div class="progress" id="xpProg" style="display:none;margin-top:12px"><i></i></div>
      </div>
      <footer><button class="btn" id="xpCancel">ยกเลิก</button><button class="btn primary" id="xpGo"><i class="ico" data-i="download"></i> ดาวน์โหลด</button></footer></div>`;
    document.body.appendChild(modal);
    const close = () => modal.classList.remove('on');
    modal.querySelector('#xpClose').onclick = close; modal.querySelector('#xpCancel').onclick = close;
    modal.addEventListener('mousedown', e => { if (e.target === modal) close(); });
    modal.querySelectorAll('.xp-fmt').forEach(b => b.onclick = () => { state.fmt = b.dataset.f; if (state.fmt === 'pdf') LIB.need('pdf'); modal.querySelectorAll('.xp-fmt').forEach(x => x.classList.toggle('on', x === b)); modal.querySelector('#xpPdfOpt').style.display = state.fmt === 'pdf' ? '' : 'none'; });
    modal.querySelector('#xpAll').onclick = e => { e.preventDefault(); modal.querySelectorAll('#xpCols input').forEach(c => c.checked = true); };
    modal.querySelector('#xpNone').onclick = e => { e.preventDefault(); modal.querySelectorAll('#xpCols input').forEach(c => c.checked = false); };
    modal.querySelector('#xpGo').onclick = run;
    return modal;
  }
  /** เปิดหน้าต่างส่งออก: getter = async () => ({title, sub, headers, rows, file, sheet, defaultCols?, note?}) */
  async function open(getter, opts) {
    opts = opts || {};
    ensureModal();
    state = { fmt: opts.format || 'xlsx', getter, T: null };
    modal.querySelector('#xpTitle').textContent = 'กำลังเตรียมข้อมูล…';
    modal.querySelector('#xpCols').innerHTML = '<span class="muted">กำลังโหลด…</span>';
    modal.querySelectorAll('.xp-fmt').forEach(x => { x.classList.toggle('on', x.dataset.f === state.fmt); x.style.display = (opts.formats || ['xlsx', 'csv', 'pdf']).includes(x.dataset.f) ? '' : 'none'; });
    modal.querySelector('#xpPdfOpt').style.display = state.fmt === 'pdf' ? '' : 'none';
    modal.querySelector('#xpProg').style.display = 'none';
    modal.classList.add('on');
    LIB.need('xlsx');   // โหลดตัวสร้าง Excel ล่วงหน้า ระหว่างรอข้อมูล
    try { state.T = await getter(); } catch (e) { modal.classList.remove('on'); return; }
    const T = state.T, def = T.defaultCols;
    modal.querySelector('#xpTitle').textContent = 'ส่งออก: ' + T.title;
    modal.querySelector('#xpSub').textContent = `${T.rows.length.toLocaleString()} รายการ` + (T.sub ? ' · ' + T.sub : '');
    modal.querySelector('#xpCols').innerHTML = T.headers.map((h, i) => `<label><input type="checkbox" class="chk" value="${i}" ${!def || def.includes(h) ? 'checked' : ''}> ${esc(h)}</label>`).join('');
    modal.querySelector('#xpColsWrap').style.display = T.headers.length > 3 ? '' : 'none';
    modal.querySelector('#xpFile').value = T.file + '_' + fstamp();
  }
  async function run() {
    const T = state.T; if (!T) return;
    const idx = [...modal.querySelectorAll('#xpCols input:checked')].map(c => Number(c.value));
    if (!idx.length) return toast_('เลือกอย่างน้อย 1 คอลัมน์');
    const out = Object.assign({}, T, { headers: idx.map(i => T.headers[i]), rows: T.rows.map(r => idx.map(i => r[i] == null ? '' : r[i])), file: modal.querySelector('#xpFile').value || T.file });
    const go = modal.querySelector('#xpGo'); go.disabled = true;
    try {
      if (T.fix) out.rows = await T.fix(out.headers, out.rows);
      if (state.fmt === 'csv') csv(out);
      else if (state.fmt === 'xlsx') { if (await xlsx(out) === false) throw new Error('สร้างไฟล์ Excel ไม่สำเร็จ'); }
      else {
        const or = modal.querySelector('input[name=xpOr]:checked').value;
        const pg = modal.querySelector('#xpProg'); pg.style.display = '';
        await pdf(out, { orientation: or === 'auto' ? null : or, progress: v => pg.firstElementChild.style.width = Math.round(v * 100) + '%' });
      }
      modal.classList.remove('on'); toast_('ดาวน์โหลดแล้ว');
    } catch (e) { toast_('ส่งออกไม่สำเร็จ: ' + e.message, 5000); }
    go.disabled = false;
  }
  return { open, csv, xlsx, pdf, pdfFromElement, stamp, save, xsave };
})();
</script>
