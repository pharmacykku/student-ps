# อัปโค้ดขึ้น Google Apps Script อัตโนมัติเมื่อ push เข้า main
# ยังไม่ตั้งค่า → ข้ามขั้นตอน deploy (ไม่ขึ้น error) · วิธีตั้งค่าดู DEPLOY.md
# Secrets ที่ต้องมี: CLASPRC_JSON, SCRIPT_ID, DEPLOYMENT_ID + ไฟล์ appsscript.json ใน repo
name: Deploy to Apps Script
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check setup
        id: chk
        env:
          C: ${{ secrets.CLASPRC_JSON }}
          S: ${{ secrets.SCRIPT_ID }}
          D: ${{ secrets.DEPLOYMENT_ID }}
        run: |
          if [ -f appsscript.json ] && [ -n "$C" ] && [ -n "$S" ] && [ -n "$D" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ยังไม่ได้ตั้งค่าอัปขึ้น Apps Script อัตโนมัติ — ข้ามขั้นตอน deploy (โค้ดเก็บบน GitHub แล้ว) · ดูวิธีตั้งค่าใน DEPLOY.md"
          fi
      - if: steps.chk.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - if: steps.chk.outputs.ready == 'true'
        run: npm install -g @google/clasp@2.4.2
      - name: Write credentials
        if: steps.chk.outputs.ready == 'true'
        env:
          C: ${{ secrets.CLASPRC_JSON }}
          S: ${{ secrets.SCRIPT_ID }}
        run: |
          printf '%s' "$C" > ~/.clasprc.json
          printf '{"scriptId":"%s","rootDir":"."}' "$S" > .clasp.json
      - name: Push code
        if: steps.chk.outputs.ready == 'true'
        run: clasp push -f
      - name: Update web app deployment
        if: steps.chk.outputs.ready == 'true'
        env:
          D: ${{ secrets.DEPLOYMENT_ID }}
        run: clasp deploy -i "$D" -d "GitHub ${GITHUB_SHA::7}"
